server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.json$ {
        add_header Access-Control-Allow-Origin *;
        default_type application/json;
    }

    location /.well-known/ {
        add_header Access-Control-Allow-Origin *;
    }
}
